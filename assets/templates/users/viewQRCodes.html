<div id="site_content">


    <div class="content">
        <h2>View Registered Users</h2>
        <p>
        <table class="table table-bordered bg-light text-dark">
            <thead>
            <tr style="color:red;font-weight:bold;">
                <th>S.No</th>
                <th>From Name</th>
                <th>QR Name</th>
                <th>Date</th>
                <th>View</th>               
            </tr>
            </thead>
            <tbody>
            {% for i in data %}
            <tr style="color: Green">
                <td>{{forloop.counter}}</td>
                <td>{{i.fromUser}}</td>
                <td>{{i.qrName}}</td>
                <td>{{i.cdate}}</td>
                <td><a class="btn-link" href="/viewSharedQRS/?uid={{ i.id }}"
                       style="color:DARKBLUE">View</a></td>
               
            </tr>
            {% endfor %}

            </tbody>
        </table>
    </div>
</div>

{%endblock%}
